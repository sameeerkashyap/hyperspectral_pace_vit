[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperspectral-pace-vit"
version = "0.1.0"
description = "Wavelength-aware ocean-color modeling with PACE OCI Level-2 data"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "h5netcdf>=1.3", "h5py>=3.10", "torch>=2.2"]

[project.optional-dependencies]
notebooks = ["nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
discovery = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
